apiVersion: v1
kind: Service
metadata:
  name: redis-stack
  labels:
    app: redis-stack
spec:
  selector:
    app: redis-stack
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-stack
  template:
    metadata:
      labels:
        app: redis-stack
    spec:
      restartPolicy: Always
      containers:
        - name: redis
          image: redis/redis-stack-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi
---
# Redis Stack starts with default config, RediSearch is preloaded.
