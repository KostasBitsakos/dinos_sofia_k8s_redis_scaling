---
apiVersion: v1
kind: Service
metadata:
  name: redis-vector-headless
  labels:
    app: redis-vector
spec:
  ports:
    - port: 6379
      name: redis
  clusterIP: None
  selector:
    app: redis-vector
---
apiVersion: v1
kind: Service
metadata:
  name: redis-vector
  labels:
    app: redis-vector
spec:
  type: ClusterIP
  selector:
    app: redis-vector
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-vector
spec:
  selector:
    matchLabels:
      app: redis-vector
  serviceName: "redis-vector-headless"
  replicas: 5
  template:
    metadata:
      labels:
        app: redis-vector
    spec:
      containers:
        - name: redis
          image: redis/redis-stack-server:7.2.0-RC3
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 200m
              memory: 400Mi
          volumeMounts:
            - name: data
              mountPath: /data
      terminationGracePeriodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-storage  # or use your real SC
        resources:
          requests:
            storage: 1Gi
